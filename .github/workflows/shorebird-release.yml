name: Shorebird Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Auto bump build number in pubspec.yaml
        run: |
          OLD=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          NAME=$(echo $OLD | cut -d'+' -f1)
          BUILD=$(echo $OLD | cut -d'+' -f2)
          NEW_BUILD=$((BUILD + 1))
          NEW_VERSION="${NAME}+${NEW_BUILD}"
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
          echo "Bumped version from $OLD to $NEW_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump build number to $NEW_VERSION [skip ci]"
          git push

      - name: Shorebird Release Android (APK)
        uses: shorebirdtech/shorebird-release@v0
        with:
          platform: android
          args: --artifact=apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shorebird-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
