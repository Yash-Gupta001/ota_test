stages:
  - release
  - patch

shorebird-release:
  stage: release
  image: ubuntu:22.04
  when: manual
  variables:
    SHOREBIRD_TOKEN: $SHOREBIRD_TOKEN
    GIT_DEPTH: "0"
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl unzip openjdk-17-jdk-headless git
    - curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
    - export PATH="$HOME/.shorebird/bin:$PATH"
  script:
    - OLD=$(grep '^version:' pubspec.yaml | sed 's/version:[ ]*//')
    - NAME=$(echo "$OLD" | cut -d'+' -f1)
    - BUILD=$(echo "$OLD" | cut -d'+' -f2)
    - NEW_BUILD=$((BUILD + 1))
    - NEW_VERSION="${NAME}+${NEW_BUILD}"
    - sed -i "s/^version:.*/version $NEW_VERSION/" pubspec.yaml
    - echo "Bumped version from $OLD to $NEW_VERSION"
    - git config user.name "gitlab-ci[bot]"
    - git config user.email "gitlab-ci[bot]@noreply.gitlab.com"
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git add pubspec.yaml
    - git commit -m "chore: bump build number to ${NEW_VERSION} [skip ci]"
    - git push origin HEAD:${CI_COMMIT_REF_NAME}
    - export PATH="$HOME/.shorebird/bin:$PATH"
    - shorebird release android --artifact=apk
  artifacts:
    name: shorebird-release-apk
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    expire_in: 30 days

shorebird-patch:
  stage: patch
  image: ubuntu:22.04
  rules:
    - if: '$CI_COMMIT_BRANCH == "shorebird"'
  variables:
    SHOREBIRD_TOKEN: $SHOREBIRD_TOKEN
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl unzip openjdk-17-jdk-headless git
    - curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
    - export PATH="$HOME/.shorebird/bin:$PATH"
  script:
    - export PATH="$HOME/.shorebird/bin:$PATH"
    - shorebird patch android --release-version=latest --allow-asset-diffs
